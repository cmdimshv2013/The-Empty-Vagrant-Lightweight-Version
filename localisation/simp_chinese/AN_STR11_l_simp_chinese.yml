 crs_event.3031.name:0 "短命帝国与第二次银河战争（B.G.1157年-B.G.973年）"
 crs_event.3031.desc:0 "泰坦第一帝国的开国皇帝萨门考大帝重用摩西那亲王，令其帮忙打理政事，在暮年时更皈依了摩西那的真神教。前1120年，萨门考大帝逝世前一年还听从摩西那亲王的建议，将好战的大皇子苏-尼塞拉放逐，更改继位人为迎娶摩西那公主的小皇子。前1119年，苏-尼塞拉在萨门考大帝的葬礼上政变上台，一举减除小皇子党羽，并将小皇子软禁，成为了第一帝国的第二任皇帝。这场政变史称“血红葬礼”。苏-尼塞拉称帝后弃用支持小皇子的摩西那亲王，并将摩西那人剔除出政治班底，废除帝国首相一职，大权独揽。他暴虐严苛的统治令帝国动荡，内政混乱。苏-尼塞拉逝世后，其子昂拉继位，他试图通过军事改革中兴帝国，并通过不断更换首相人选来平衡各方利益，这取得了一定的成效，但又激化了个领地之间的矛盾，为此昂拉中兴终以失败结束。此后，皇位之争就未停止，而各地的反抗和复国行动也接踵而来，泰坦第一帝国陷入了内忧外患。最终，一直未放弃抵抗的斯巴达人暗中和撤入深空的同胞们取得联系，他们里应外合，并付出了极大的代价，终于找到了让泰坦兴起的隐蔽的反物质喷泉。在夺取反物质喷泉后，其他被统治的文明世界响应了斯巴达反抗泰坦帝国统治的号召，掀起了第二次银河战争。第一泰坦帝国在乱局中结束，泰坦人再次逃入深空。" 

 crs_event.103.name:0 "大议会·诞生 应对灾难"
 crs_event.103.desc:0 "当乔治·M·塞隆引领‘全球科技企业精英大会’后，联合国也正式召开联大会议，会议上明确了目标，全世界的[Root.Species.GetName]团结起来，共同应对这场空前的危机。虽然[Root.Species.GetName]达成了史无前例的团结，但纷争依旧出现了，[Root.Species.GetName]联盟分成了“宇宙派”和“母星派”，“宇宙派”认为无垠的宇宙具有无限的生存空间，以及无限的资源，[Root.Species.GetName]应该去宇宙找寻新的家园。“母星派”则认为太空飞船技术尚不成熟，能否坚持到找寻新家园非常不乐观，母星并不会被毁灭，地表可能不适合生存，建议转移到地下进行躲避。经过了[Root.Species.GetName]联盟反复讨论后，“宇宙派”和“母星派”都无法说服对方，决定暂时搁置争议。"
 crs_event.203.name:0 "先祖编年史 （B.G.1800年-B.G.1590年）复苏的文明"
 crs_event.203.desc:0 "艰苦的殖民环境带来的生存压力刺激了科技的发展，机械、智能、基因技术在接连爆发科技狂潮中应运而生。在解决了生存和生产力的问题后，[Root.Species.GetName]开始试图重建被大离散带来的分离局面，和其他文明点建立联系。海格拉在其中起到了重要的作用。在海格拉德高望重的塞隆家族主导研发的量子通讯项目成功后，海格拉向相对距离较近的、可能存在[Root.Species.GetName]的各星系发射携带量子通讯技术细节的探测器，并在多年后成功建立了联系。但因航空技术的局限，文明之间的联系并不紧密——漫长的太空旅行仍然代价高昂。海格拉的塞隆家族引领了这个时代的科技发展，而还属于文明边缘的本图西人在这个时代的末期发现了深空中的反物质喷泉，这支属于游荡文明的部族敏锐的发现了其中的价值——每种新能源的诞生会带来跨时代的巨变。他们是对的，因为反物质将在此后的历史中担任至关重要的角色。"
 crs_event.303.name:0 "大议会时代（B.G.973年-B.G.408年）"
 crs_event.303.desc:0 "第二次银河战争后，以斯巴达联军为首的胜利方组织了议事会性质的“银河大议会”，开创了多组织共同商讨、决议星域事物的先河。前973年，第一届银河大议会在阿尔戈斯III召开。会议承认战胜方在第二次银河战争中的既得利益，签订处置泰坦同盟的《阿尔戈斯合约》，摩西那、斯巴达、格里克之间还分别签署了一系列协议，它们共同构成了阿尔戈斯体系、确立了战后新秩序，为此后近七百年相对稳定的大环境提供了前提，这段稳定发展期被史学家称为“大议会时代”——前银河的黄金时代。\n稳定的环境促进了经济贸易的复苏与繁荣，带动了民用科技的发展。宽带量子通讯阵列技术被海格拉输出，四十年间就覆盖了直径300光年的核心区域，提高了文明世界之间的通讯效率。同时，在二次殖民潮中形成的如奥罗拉、麦格尼西亚一般，星星点点的散落在宇宙中的新文明世界，它们与坚毅的斯皇权让渡与巴达，浪漫的格里克等一起构成了这个百花齐放的大议会时代。"
 crs_event.403.name:0 "皇权让渡与星省制的瓦解（A.G.562年-A.G.893年）"
 crs_event.403.desc:0 "史学家阿奎莉娜.邓巴认为，奥斯顿改革并未从根本上解决帝国的基本矛盾。改革只是对这种状态的屈服，在表面上遏制了帝国内分离势力，但代价却是变相承认了领主和他们的自治权。虽然奥斯顿建立的权责关系以卡住资源的方式巧妙的削减领主可维持的军事力量，又用联姻的方式将帝国家族化，但随着时间推移，权责关系被选择性遗忘，用于转圜的亲缘纽带也在淡去，同时，奥斯顿的宗教宽容政策使帝国失去了真神教徒的支持，于是奥斯顿后的皇帝不断面临着‘维系统治’、‘皇权让渡’的抉择。在持续近150年的皇权和地方势力的斗争中，皇帝逐渐变成了名义上的共主——这很可能得益于皇帝直辖区仍旧兵强马壮，皇权的萎缩已是不争的事实，在愈发庞大的疆域中，光凭武力和要塞也无法挽救帝国疆域的崩裂之势。748年初，‘黄金王’亨利亚特通过政变登基称帝。亨利亚特是奥斯顿大帝的玄孙，早年因其母为晨曦财阀之女而受宫廷排挤，受封于皇帝直辖区边境靠近晨曦的锡拉库萨。但也正是因为此原因，亨利亚特得以聚集了巨额财富用以政变。登基之初，亨利亚特就选用晨曦人为财相，对帝国经济进行改革，实行重商主义，废除自‘收割者迪特里’时代起几经更改却始终未被废除的民用舰船装配限制令，对外则利用各独立领之间的矛盾巧妙的保持平衡。虽然这未真正转变帝国领土逐渐崩溃的事实，但却保障了皇帝直辖区的繁荣，令其在帝国中仍在各方面处于领先地位。在‘黄金王’统治末期，改革带来的弊端逐一显现，重商主义导致依靠财富成为小贵族的市民阶级崛起，和宫廷中的职业官僚一起冲击了阿特拉斯的贵族阶层，特权转变为平权，令贵族阶层丧失了归属和认同感。最终在831年末，亨利亚特被暗杀，贵族拱卫其子‘末日帝王’卡罗曼登基，亨利亚特的改革成果也随之烟消云散。领主之间的兼并战争却如其在位时期一样持续，这最终产生了三大领主地：晨曦领、斯瓦罗格领、天启领。奥罗拉领、阿瓦图自治领等一系列小领地被吞并。至此，帝国名存实亡，取而代之的是林立的诸多邦国。"
 crs_event.4041.name:0 "第四次银河战争与帝国的崩毁（A.G.893年-A.G.921年）"
 crs_event.4041.desc:0 "早在各邦国间兼并战争开始之前，第三次银河战争中退入深空的斯巴达人就已逐步与斯巴达本土的地下反抗组织秘密取得了联系，并与同样退入深空的海格拉人成立的‘自由海格拉’复国组织结为反第二帝国联盟军。这些人在兼并战争期间在本土进行了旷日持久反抗与起义，却未能扭转局面，直到893年，斯巴达的英格拉姆带领游击队和皇帝直辖区中的斯巴达人地下反抗组织会和，打响了复国战争。斯巴达舰队装备了由‘自由海格拉’中科学家研发出的舰载曲率引擎，以星系内跃迁技术与游击战术相配合，取得了小规模运动战的胜利，但兵力优势依旧在泰坦一方。英格拉姆决定派遣多支技术分队前往各大独立领，以舰载曲率引擎的安装、维护等换取军事支持，晨曦、斯瓦罗斯、天启先后与斯巴达达成一致，天启保持中立，斯瓦罗斯、晨曦参战，第四次银河战争开始。由于资源和生产线的限制，舰载曲率引擎产量有限，盟军舰队尚不具备全体换装的能力，为充分利用少部分完成换装的高机动性舰船，英格拉姆力排众议启用了一批游蹿在边缘星系，被称为“荆棘乞丐”的亡命之徒，作为诱敌深入的先锋，但同时为保证行动的保密性而未授予其正式的部队编号。919年，盟军发动的三大会战：“泰坦之殇”、“GGA行动”、“冬域攻势”取得了战争的主动权，920年末，双方在凯旋堡附近展开决战，泰坦的“末日帝王”卡罗曼战死，第二泰坦帝国灭亡。"
