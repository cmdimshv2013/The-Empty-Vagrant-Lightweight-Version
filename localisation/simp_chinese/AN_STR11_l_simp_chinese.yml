 s2s:0 "战术激光炮"
 s2s_DESC:0 "军备竞赛从来没有被在明面上被承认过，但实际上名大相关研究所及制造商早已心知肚明。为了顺应越来越复杂多变的战场情况，能够适应不同射程的战术型武器成为研发热门。沙希木家族原本在天启帝国中默默无闻，被当作是依靠泰坦帝国时期留下来的遗产而混日子的家族。但由其完全主持开发的新型光子能量激发器很快地成为了所有战术激光武器的标准配件，将原本打算靠战术激光炮大赚一笔的别哈伦家族狠狠地比了下去。但沙希木家族对这项技术的原理完全保密--法蒂玛.沙希木其实公开过其原理:在制造激发器时，注入对真神的虔诚。"
