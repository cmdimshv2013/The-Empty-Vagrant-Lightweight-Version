 sgg_Reactor_desc:0 "足够功率的能源是支持舰船各项系统正常运行的前提。很少会有人信心满满的认为自己舰船的能源示远都处在'够用’的状态中，各种因为超过可用功率而导致的过载事故屡见不鲜。由克劳利集团开发的辅助能源核心能额外为舰船增加一定的能源供应。"
 sgg_Thruster:0 "标准推进器"
 sgg_Thruster_desc:0 "在泰坦第一帝国时期，为了与拥有航速优势的帝国安全部队对抗，一位天才工程师为反抗组织'游荡者'发明了最初的辅助推进发动机。它能显著的提升舰船航速，有效的弥补了游荡者在航速上的劣势。限于当时的材料和技术，运行这一组件会对引擎造成极大的损伤，但它仍然是一项伟大而实用的发明。此后针对它的改进一直都在不断进行，直到如今才终于去掉了那些可怕的副作用但它对舰船航速的提升也变得趋于'稳定可靠'"
 sgg_Sensor:0 "标准传感器"
 sgg_Sensor_desc:0 "标准传感器"

 crs_event.1.name:0 "结局"
 crs_event.1.desc:0 "在第四项联大方案下，一切恐怖组织、行为及暴乱分子都被全力镇压，他们要么被彻底肃清，要么潜伏起来不再行动。我们同时在探寻过程中发现了一些有些古老但却及其强力的武器技术，似乎和我们的前生有关，我们将开启第二阶段的探索。"
 crs_event.2.name:0 "结语"
 crs_event.2.desc:0 "这个纪元中大多名称已不可考的利益团体一度大放异彩雄踞深空，但当越来越多的星系变为有主之地、当深空不再只是一个抽象的名词、当反物质能源的被认为濒临枯竭，当意识形态中分歧愈发明显和尖锐，繁荣与和平不过是脆弱的泡影，战争却必将如期而至。\n\n同时，我们还找到了一个记录了战术武器的数据库，尽管我们不知道为什么这些古老的武器能爆发出如此强的能量。"
 crs_event.3.name:0 "结语"
 crs_event.3.desc:0 "文明的联系与融合是历史大趋势，第一帝国进行了不成熟的尝试，某种程度上促进了大议会的诞生，大议会制定的“阿尔戈斯体系”将人类带入了稳定的大发展，而星门在发展中扮演着划时代的角色，它既促进了联系与融合，又在客观上破坏了“阿尔戈斯体系”，最终让大议会被第二帝国取代，但在第二帝国统治下、在千年时光中，文明的融合又进一步加强了。我们在这次的探索中发现了更加高级的武器技术与两艘匪夷所思的舰船————战巡 穹鸟   战列 格萨尔王"
 crs_event.3.a:0 "查看资料：穹鸟"
 crs_event.3.b:0 "查看资料：格萨尔王"
