 crs_event.102.name:0 "大议会·雏形"
 crs_event.102.desc:0 "在这场[Root.Species.GetName]共同的空前危机中，被称为百年难遇的物理奇才的乔治·M·塞隆举办“全球科技企业精英大会”。会议中，乔治·M·塞隆向在座精英人士强调——走出[Root.Species.GetName]的摇篮才是希望所在。依靠塞隆独特的个人魅力，他的言论获得在场人士的强烈认同，所有参会人员合作成立了塞隆联合企业，出资方包括东西方的各大企业巨头，以及阿拉伯世界的皇室。会后，塞隆联合企业正式向外界宣布，开始研制“舰载型聚变反应堆”技术。这可以使[Root.Species.GetName]不再需要星球的支持，对[Root.Species.GetName]来说，危机永远和机遇共存。"
 crs_event.202.name:0 "先祖编年史 （？？？~-B.G.1800年）艰苦的殖民"
 crs_event.202.desc:0 "距今约三千年前，深空对于[Root.Species.GetName]来说是一片藏在迷雾中的蛮荒之地，[Root.Species.GetName]在航天技术中使用的体积庞大的聚变发动机只能使舰船以不足10%的光速航行，到达可开发星系可能要经过上百年的时间，殖民者在舰船的冷冻仓内进行低耗“冬眠”，确保生命体征不在到达目标中的宜居星系前消失。在这单程、定点、不可逆的迁徙中，殖民者们面对的，除已知星图外的不确定性因素庞杂，巨大的危险时刻笼罩着他们：不成熟的航天技术导致舰船故障，那么舰船将成为这支殖民队的坟墓。部分人好运的安全抵达，却在欢呼后发现这里并不存在可供殖民的生态环境，然后绝望的等待着补给耗尽…… 总之，死亡的阴影与殖民者们如影随形，只有少数的殖民者存活了下来，考古学家们相信最早的、可考据的文明点产生于斯瓦罗斯的冰封“母星”斯瓦罗斯、阿瓦图的原始之森、风沙遍地的摩西那、充斥着钢铁与熔岩的斯巴达与地势崎岖的格里克AB、远离各殖民点的矿物盐溶液和风蚀岩并存的麦提克斯。艰苦卓绝的殖民潮持续了百年，人们在新家园中艰难求生，并因各星系的不同环境逐步发展出了富有星系特征的文明内涵。"
 crs_event.302.name:0 "第一次银河战争与第一泰坦帝国（B.G.1240年-B.G.1157年）"
 crs_event.302.desc:0 "第一次银河百年战争是可被考据的，第一场在时间、空间、战局规模上都空前庞大的全面战争。马苏里认为很多如今已不可考的文明世界就是在该战争中毁灭的。战争初期泰坦和摩西那人一路高歌猛进，泰坦击败斯巴达主力，摩西那吞并阿瓦图后兵锋直指斯瓦罗格星系，斯瓦罗斯人投降，接着战争双方就陷入了近二十年的相持阶段，但同时，泰坦放弃海格拉转攻本图西、切断了斯巴达联军的反物质补给就已奠定了胜利的基础，一切不过是时间问题。时间进入前1157年，本图西退战投降，曾得罪了泰坦部族则因惧怕报复而远走深空。同年海格拉暗中求和，用苛刻的条约和联姻作献礼，保住了部分自制权。次年斯巴达在战略性撤退中损失惨重，格里克只得投降。第一泰坦帝国的建立宣告了第一次银河战争的结束，该帝国以武力将各文明世界联系起来，但游荡文明特有的政治幼稚也决定了这段时间不会长久，严重失衡的利益分配为帝国的短命埋下了伏笔。"
 crs_event.402.name:0 "奥斯顿时代（A.G.426年-A.G.562年）"
 crs_event.402.desc:0 "泰格斯大帝建立的制度基本维持了帝国近四百年的稳定，在该大环境下，人类已知宇宙的范围也在扩张，这些探索性扩张行为有些来自皇帝本人，但更多出自于原边界的总督。帝国的疆域不断扩张，但在为帝国输入资源的同时也增加了统治成本。经过泰格斯后的‘短命的泰格斯（泰格斯Ⅱ）’、‘收割者迪特里’、‘宽容的罗哈德’、‘庸人弗兰德斯’四位皇帝的统治，扩张形成的边缘区域逐步转变为不稳定因素。此期间为适应扩张至630光年直径、并仍在持续扩张的疆域而发生的权利斗争、经济改革又无形中削弱了帝国对偏远地区的控制力。当时间进入390年末，很多地方开始不断发生小规模叛乱，而本被用来维系统治的星省总督出于客观或主观的原因，也纷纷谋求更多的自治权。406年，各地的起义和反抗者建立起联系，残余的斯巴达势力开始也常在边境发起袭击，帝国形势严峻。‘庸人弗兰德斯’无法掌控失控的局面选择退位，其子奥斯顿被推上风口浪尖。奥斯顿的幼年就是在动荡中度过的，为了让帝国从疲于应对的叛乱和反抗中解脱，他继位后针对各平民大会的诉求发布了《塞里努斯敕令》，宣告阿特拉斯银河帝国改革的开始。《敕令》中包含宗教宽容、废除联姻限制等一系列改革政策，并将部分在‘收割者迪特里’时期被完全剥夺权利的区域重新定为星省。奥斯顿通过逐步的权利下放笼络了一批总督，421年，其又根据阿斯加德的区议会的请求颁布《特鲁德海姆条例》，承认部星省的非阿特拉斯总督合法后又进一步承认部分边缘星区自治权。作为交换，各自治领有义务向帝国提供舰队和资源，并提供军事支持。在权力的诱惑下，叛乱地区也逐渐归于平静。448年，奥斯顿对星省总督提供的军队进行混编，同时招募更多的阿特拉斯军官，重新得到了大量的资源和充沛的武装力量，恢复了对边远区域的统治。晨曦邵氏族长更用资源与金钱让帝国将领主的任命权交与领地人民本身——不过领主永远只出现在几大财阀中间。奥斯顿大帝也因此举被称为“开明的奥斯顿”。"
