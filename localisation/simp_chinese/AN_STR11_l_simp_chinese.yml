 pt:0 "四联粒子炮"
 pt_DESC:0 "毫无疑问，作为人类军事科技最尖端的结晶，粒子炮象征着一个新时代的开端。在投入了巨额的研发资金和漫长的实验周期之后，可以进入实战应用的粒子炮终于正式登上舞台。尽管因为种种技术局限，粒子炮还远没有发挥出预想中的无敌威力，甚至也谈不上对其他武器的压倒性优势--但它忠实的拥簇者们还是坚信着，粒子炮就是一切武器的未来。"
 otm_l:0 "大型四联粒子炮"
 otm_m:0 "中型四联粒子炮"
 otm_s:0 "小型四联粒子炮"

 zl:0 "激光炮"
 zl_DESC:0 "在大气层内，武器级的激光进入实战还不是太久远的事情。然而在太空中，巨型的战舰提供了无尽的能源供给，宇宙中没有恼人的云层，远处的敌人也无处可逃。\n当激光命中目标时会产生强烈的高温和电离现象，这-现象会随着激光武器的持续引导打击而变得更具破坏性--直至护盾消散，装甲粉碎，舰船化作宇宙中的小小尘埃。"
 lzz_l:0 "大型激光炮"
 lzz_m:0 "中型激光炮"
 lzz_s:0 "小型激光炮"

 kk:0 "磁轨炮"
 kk_DESC:0 "磁轨炮的原理是如此简单，以至于小孩子都认为自己会做磁轨炮玩具。在某个时代里，人们相信只需要粗暴的堆砌更长的导轨，更密的线圈和更强的电流，磁轨炮就能立竿见影的获得更强的威力。然而复杂的战场环境降低了那些'更大'磁轨炮的可靠性--它们更容易在遭受撞击后出现原因复杂的过载短路，这甚至会造成船毁人亡。随着技术的逐渐成熟磁轨炮安全性问题终于得以解决，但它的规模和威力也终究趋于'稳定’。"
 kk_l:0 "大型磁轨炮"
 kk_m:0 "中型磁轨炮"
 kk_s:0 "小型磁轨炮"

 mss:0 "导弹"
 mss_DESC:0 "导弹一直以其能够大量运载装药和长射程所为人称道从它被发明出来的那天开始就成为最受欢迎的武器之一。要不是因为在发射弧度和攻击效率上有所欠缺导弹几乎可以说是一种完美的武器。很少有飞船能一直承受来自导弹的打击，每一枚落在目标身上的导弹都会伴随着惨烈的爆炸--而真正的战士从不会厌倦目标被导弹摧毁时的华丽焰火。"
 mss_l:0 "大型导弹"
 mss_m:0 "中型导弹"
 mss_s:0 "小型导弹"

 ksk:0 "无人机"
 ksk_DESC:0 "30一体成型打印技术本身不是什么新奇的技术，但将其推向极致却是海格拉人的贡献。其中，目前广泛应用于星际合众国军事领域的无人机挂仓便是这一技术极限的绝佳展示。\n首先打印硼纤维与镁合金复合的骨架、钛合金快速成型的发动机、碳纤维增强塑料制造的外壳以及相应的武器系统;其次注入燃料、装载弹药;最后安上一颗半智能芯片。这几道工序都能够在极短的时间内完成\n当然，任何技术都有其局限性--为了拥有足够的速度，每一种尺寸的挂仓都只能生产相应尺寸的无人机，且同一时间只能使用同种无人机模块进行生产。\n什么技术局限性?!就是黑心商家想多卖几个挂仓!--橄榄山联盟理事长里奇"
 mss_l:0 "无人机"

