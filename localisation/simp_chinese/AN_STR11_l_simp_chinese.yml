 crs_event.104.name:0 ""
 crs_event.104.desc:0 "由双方各选出几位代表成立‘宇宙灾害特别理事会’，在全球以大国为节点划分片区，全球共享资源和技术，同时建立四大应对方案：\n一，协调各国开展小行星拦截技术的研发。\n二，　实行‘地下方舟’计划，为不愿意或者不能离开母星的人，提供地下巨型庇护所。\n三，联合成立‘联合轨道防御指挥部’，下辖五个大型研究中心，进行以化学能引擎的飞船和行星拦截技术开发。\n四，为应对恐怖袭击和民众暴乱，世界各国开始实行军事管理和资源分配制度；所有社会资源为人类存活和发展的大远景服务，凡抵挡这一目标的个人、组织将被认定为世界公敌。"
 crs_event.204.name:0 "先祖编年史 (B.G.1590年- B.G.1240年）新古典时代"
 crs_event.204.desc:0 "反物质喷泉的发现和开采令航空技术完成了质的飞跃——80%光速的航速让[Root.Species.GetName]的脚步不再局限在相邻的星系，以反物质为中心的供求关系让本图西商队的贸易范围覆盖了各文明世界，其作为落脚点的星系发展成了繁荣鼎盛的贸易港。同时繁盛了作为交换反物质能源的货物的产业：格里克的高档日用品产业、斯巴达的真空制造业、摩西那和斯瓦罗斯的行星矿石业都在这一时期开始了大发展。为方便贸易，本图西人在商路上建立了多个量子通讯中继站，最终建立了已知世界的通讯系统，在给自己带来巨额财富的同时也间接促使贸易交换向意识形态交流的深层转变。由此文明世界的辐射范围开始增加，构成了近现代星际国家的雏形。文明的碰撞中，以格里克为代表的文明中诞生了杰出的艺术文学，摩西那的宗教也有了更长足的发展。人性的、神性的思潮构建了这个时代。\n繁荣的新古典时代下却无强权与规则，权利真空让文明世界之间摩擦不断，斯巴达在其中扮演了复杂的角色，它试图在人类世界中建立秩序，但这个过程却充满了火药味。同时泰坦人开始登上了历史舞台。泰坦人是本图西民族中较为强悍的一支，但因其以劫掠为生的传统为其他部族所不齿，分给他们的物资始终有限，于是他们的劫掠范围不断扩张，终于引起众怒，引爆了前1350年前后的“边际之战”。斯巴达和本图西众部族联手诱歼了泰坦的主力部队，泰坦女王娄赫巴利斯在此战中香消玉殒。战败后，泰坦人逃离了文明世界的视野，却在距离本图西领地外20光年发现了新的反物质喷泉，而且产量极高。于是，在古典时代末期，泰坦人重入文明世界，带领部族的是当年女王的卫队长萨门考，他们以战争开启了新纪元。"
 crs_event.304.name:0 "星门与剧变（B.G.408年-B.G.56年）"
 crs_event.304.desc:0 "前408年末，海格拉皇家大学宣布星门构想：稳定双星系统的引力场共振点上可进行人造虫洞的建造，前382年海格拉实验星门的建设成功证实了“星门理论”，海格拉出售星门技术，星门和附属空间站开始大规模建造，已知世界进入了“大建设”时期。星门改变了传统经济模式，致使各文明世界发生了剧变：摩西那因遥远预言中的“双星闪耀之地开启天启之途”的应验更名天启帝国，祭祀集团力量上升。格里克B通过战争手段脱离格里克，形成晨曦贸易联盟。本图西作为一个独立势力因商业地位的衰落而衰败，很多部族融入其他文明世界，其中一支发起“永恒之路”运动，向未知世界之外发起探险，多年后通讯联系中断，大议会决议保留本图西常驻区。而刚兴起的麦格尼西亚人则因商业衰落沦为海盗和不法生意者。阿瓦图人通过三十年的独立运动获得了在天启帝国统治下的自治权。"
 crs_event.3041.name:0 "泰格斯大帝与第三次银河战争（B.G.56年-A.G.1）"
 crs_event.3041.desc:0 "“大建设”末期，深空中突然出现无人机攻击运输船、骚扰各国边界。大议会调查无果，人类恐慌情绪蔓延，各国间相互怀疑。前31年，天启驻银河大议会第二武官泰格斯受命调查AI入侵事件。泰格斯是天启公主的丈夫，一个战功卓著的贵族子弟，在大议会中也因能力卓越而受重用，他的报告受到了大议会的重视。报告指出：AI已发展出自我意识，并存有为摆脱人类控制而自主进攻、与人类为敌的可能性。海格拉对于此报告提出异议，要求深入调查。前28年，大议会召集紧急会议，以泰格斯调查时遭遇战的录像和AI舰船残骸为证据，证实AI存有自我意识，海格拉持怀疑态度，为此泰格斯指控海格拉与入侵的AI勾结，海格拉代表无法做出令人信服的无罪辩论，愤然退席。泰格斯奉命率领克隆人军前往海格拉调查，却遭遇AI截杀。大议会观察团代表目睹了战场散布着AI舰船残骸，确认了海格拉的罪行。大议会调停无效，派出各国联军围攻海格拉，第三次银河战争打响。泰格斯任战时总指挥，以克隆人军队控制星门，并亲自与海格拉皇家卫队战斗，终于在一场追击战后赢得了胜利，海格拉统治阶级覆灭。人类尚来不及为胜利欢呼，就发现泰坦战舰再次出现，并发起攻击。手握重兵的泰格斯与泰坦军队会合，他宣称自己是阿特拉斯人，拥有泰坦、天启皇室血统，他的目的就只有一个：征服。格斯掌控的军队在对海格拉战争开始前就把持着交通枢纽星门，各国军队被分割，且在泰格斯和阿特拉斯霸主的里应外合下，短时间内就被各个击破。泰格斯在胜利后废除大议会体系，建立阿特拉斯银河帝国，史称泰坦第二帝国，改古历法为银河历，从此开启了银河纪元。"
 crs_event.404.name:0 "辉煌与暗流（A.G.921-A.G.1000）"
 crs_event.404.desc:0 "921年，作为盟军总指挥、斯巴达复国运动的领导者和国父，英格拉姆在凯旋堡发表了《新世界宣言》，宣告在斯巴达原有领土之上建立新的国家——新欧罗巴联邦，并承诺新欧永不谋求霸权，建议现存国家把重心放到各国间的合作贸易及扩展殖民地上，将人类的火种撒满银河，共筑人类命运共同体。同年，大议会在凯旋堡重新召开，就战后秩序、领土边界等遗留问题展开讨论。在海格拉代表、自由海格拉领导人欧格尔强烈申诉，晨曦、新欧的调解下，天启交还侵吞的格鲁尼西亚及其周边领土给斯瓦罗斯，斯瓦罗斯则同意在此基础上以赎买的方式交还在第二帝国时期占据的海格拉的领土作为其复国基础。各国协调让渡部分权利给大议会，成立联合安全部，下辖联合警备队、维安部队。在第四次银河战争中诞生的先锋，作为一支一直未得到正式承认的强有力的军事力量也被收编入维安部队，称为‘荆棘之刃’。此后的四十多年里，海格拉的旧址上建立起了星际合众国，其因移民政策和原有的科技基础而发展壮大；斯瓦罗斯根据历史传统和经济环境，发展出了符合新时代的集权制；晨曦人逐渐摒除了普通意义上的政府形式，形成了资本主义公司制的国家……人类正欢呼着辉煌的大议会时代正重新降临，一艘来自未知文明的神秘巨舰突然出现在新欧的新条顿堡空间站的警戒范围，带来了末日般的毁灭力量，人类的战舰在它面前不堪一击。它深空中留下了一句语焉不详的话——羊群们，我奉着主的神谕来此：通往不朽的路降临了。挣扎是枉然的愚行，遵循是唯一的救赎。确实，任何反抗都是徒劳，新条顿堡被付之一炬，新欧损失惨重。这就是发生在983年的、惨痛的“神谕之战”。天启由于与泰坦帝国的历史渊源以及其宗教信仰、国家体制而与新欧关系日趋紧张，银河大议会也开始着手调查天启帝国。一时间各种阴谋论甚嚣尘上，宿命论重被提及，大大小小的势力团体呈几何倍的增长，各国多年的内外部矛盾积压至极限，国际形势处于一触即发，星辰大海暗流涌动…"
 crs_event.504.name:0 "####战争##########"
 crs_event.504.desc:0 "又经过了无数个岁月，四大国家直接爆发了前所未有规模的战争，这次战争使国家人口锐减至不足1%并且沉睡在最后的家园舰中..."

