 s3s:0 "战术磁轨炮"
 s3s_DESC:0 "军备竞赛从来没有被在明面上被承认过，但实际上名大相关研究所及制造商早已心知肚明。为了顺应越来越复杂多变的战场情况，能够适应不同射程的战术型武器成为研发热门。\n凛冬工业集团是这方面的佼佼者，由其主导的一项名为“激流穿冰”的专利技术被广泛地应用在其出品的战术磁轨炮上。通过在炮弹外额外包裹一层拘束磁场的方式，能够十分简单方便地增加其出膛初速。"激流穿冰"技术研究的实际上是如何在之后尽可能快速且安静地解除这层拘束磁场，否则炮弹将会在射中目标之前就丧失足够的动量\n\n目前来看，凛冬工业集团做的还不错。"
 zc_l:0 "大型战术磁轨炮"
 zc_m:0 "中型战术磁轨炮"
 zc_s:0 "小型战术磁轨炮"
 s4s:0 "战术导弹"
 s4s_DESC:0 "军备竞赛从来没有被在明面上被承认过，但实际上各大相关研究所及制造商早已心知肚明。为了顺应越来越复杂多变的战场情况，能够适应不同射程的战术型武器成为研发热门。但克劳利工业却认为，射程并不是战术型武器的核心--因此，他们出品的战术导弹发射架显得独树一帜:其独特的挂载系统能够挂载与自身舰船规格不同的导弹，从而彻底颠覆战场上原有的舰型针对关系。这一新型发射架在钢铁军团对光荣党的战斗中发挥了及其亮眼的表现，甚至连一向奚落克劳利的鲁道夫都对此大为赞赏。"
