 crs_event.31.name:0 "舰船资料：穹鸟"
 crs_event.31.desc:0 "“穹鸟"经由沙加缅度投资公司推出之初就引发了争议，这显然不是一艘正义的舰船一一它第一次登场是在A.6E.999年的苏拜，大教长本该进入“双星圣殿进行三重冠加冕礼，穹鸟却以迅雷不及掩耳之势降临，结果了天启上一任大教长的性命。当时连真神之剑在内，都没有人知道这艘舰船是怎么出现的。——“它就像深空中出现的幽灵，一柄划破星海的刺刀......等雷达侦测到时，一切都已经结束了。”沙加缅度投资公司在推出“穹鸟”时就已发出声明，他们只是“投资方”，制造方是在天狼星域、泰米洛斯边界活动着、势力强大的依诺克旧礼会。依诺克旧礼会的历史据考证能追溯到两干七百多年前他们行事低调，近乎与世隔绝地进行着自己的“修行”。对世人而言，他们始终蒙着神秘的面纱。至于依诺克旧礼会进入人们视野，那已经是近现代的事情了。当然，按照依诺克旧礼会当前的对外发言人沙加缅度投资公司的说辞来看，目前在外活动着(尤其是在虫洞中活动着)的依诺克是打着这一崇高名号的暴徒、叛教者,或是被旧礼会抛弃的“不具灵感"的人。当然，依诺克旧礼会对此负责——他们的“清理者”即将出动。每当需要被处理掉的目标“非常特殊”时，依诺克旧礼会派出的“清理者”就会是“穹鸟”。穹鸟级装载了依诺克旧礼会特有的战术组件与超级武器：规范玻色子相淬灭增幅器和激发态偏移光束，这也是首次出现在大众视野中的依诺克科技。与常规武器增幅器不同，依诺克旧礼会使用了他们独有的科研成果，将武器系统变为规范玻色子群体相淬灭过程中的附着物，从而增强武器的杀伤力——当然，也会增加大量的能耗。而激发态偏移光束则是依诺克旧礼会根据激发态光束武器为“穹鸟"特别打造的定制版，能够通过光学技巧有效干扰敌人的火控系统，使自己在完成“清理"任务后从炮火中脱身。据可靠消息称，金旗会、星耀盟、磁星集团，乃至于活动在女娲、天蝎的巨头海岸线资本中，都有不少依诺克的信徒。据可考消息分析，干年前的依诺克在海格拉也同样拥有不少身价不菲的信徒。传说，加入依诺克旧礼会的人都会获得一本《怛特罗预言书》，传说，它记录了这世界上光和暗的第一次相聚，通晓时间的奥秘......但这本书早已在历史长河中遗失，目前市场上流传的都是后人杜撰的猎奇读物。而在近现代，依诺克旧礼会信徒从不离身的信物变成了“怛特罗预言镜"。X机构的解密档案解读了依诺克圣物“怛特罗之镜"的神秘功效——本质上，它是用某种物质连接个人的中间神经元，从而实现直接、高效信息传输的工具，因而每个人都可以在“镜”中得到主神怛特罗的启示。所以，准确来讲，“怛特罗之镜应该被称为“怛特罗神经中枢传导镜"。这样的信息传输过程本质上是将无序的纪录以影像显现，但每个人的脑处理能力、记忆、思维方式不同，于是他们对这些无序影像也会处理出不同结果。而这些，就会被他们认为是“预言”。于是，就像可找到的历史记录中所能看见的那样，依诺克旧社会中“盛产”两种人：天才，和疯子。 "
 crs_event.32.name:0 "舰船资料：格萨尔王"
 crs_event.32.desc:0 "“格萨尔王"是由依诺克旧礼会授权、沙加缅度投资公司推出的顶级重火力战列舰，它搭载着依诺克旧礼会特有的战术组件与超级武器：规范玻色子相淬灭增幅器和激发态放大光束——在穹鸟级面世后，这两项依诺克科技出色的表现令人眼前一亮，但至今仍未有任何势力有能力模仿或复制它们的独特功效。与穹鸟级一样，相淬灭增幅器让格萨尔王级越战越强，但额外的功耗在战列舰面前相比之下更易解决。激发态放大光束则是为战列舰型量身定做的，它在造成伤害的同时还能够放大目标的体积系数，从而使火控雷达更容易锁定目标——这正是依诺克信徒们一贯的“天才”之处：当无法通过补足自身来解决问题时，就去削弱敌人，让问题不再是问题。格萨尔王级在战场上的表现，与“格萨尔王这个名字背后那源自遥远传说中的来历十分相符。综合《泰坦王表》、记录者神庙中的部分信息以及一些零散的历史记录来看，“格萨尔王"这个名称产生的年代，人类还被拘禁在某颗星球表面…“那时候星球与星球之间还无法联系。那时候不是现在，人们不会动不动就说银河是一个世界，到处宣讲所有人都在同一个世界。那时的人觉得银河无比广阔，可以容纳下很多不同的世界。那时候人们并不知道除了自己的世界之外，还有没有别的世界......”——《“前"反物质年代考第二卷“源点"及内部星系地名辑证》据说，“格萨尔王”就是那个时代留下的依诺克教主祭的称号。后来，也被用于命名依诺克教的“中央庙宇"。传说中“中央庙宇"是一艘巨大的飞船——依诺克教的一位“格萨尔"就驾驶着这艘船降临在泰坦人生活的小行星带，从此成为了泰坦人信奉的神明,直到第一泰坦帝国成立。随后的记载中，依诺克教的地位在第一泰坦帝国的第二任皇帝时期急转直下：......B.6.E.1119年，萨门考大帝的葬礼在血色中结束。然而，“血红葬礼"终结的不仅仅是“摩西那暗王时代"一苏·尼塞拉推翻的并不只是来自摩西那的真神，还有先王信仰的神明“格萨尔"。当苏·尼塞拉的战舰摆着整齐的队列傲然刺破大气层之时，依诺克主祭却断开了所有的联络讯号,从容地走入中央庙宇。随后，中央庙宇“格萨尔王"的基座上突然伸展开巨大的炮座，铸造出火焰与钢铁的长城，与苏·尼塞拉的大军展开对峙。三十名助祭将整整十三船的弹药运入了中央庙宇，他们保护着忠诚的信徒，在苏·尼塞拉的炮火威胁下前往“格萨尔王"的脚下。主祭在“格萨尔王的最高处向苏·尼塞拉说：你用自己的欲望玷污了先王萨门考的葬礼，它蛊惑你杀死了自己的弟弟。魔已潜藏到了你的内心里，在你的血液里奔窜，发出狺狺的笑声，你却听不见。你的帝国正在走向衰亡，你却以为它正要崛起。《怛特罗预言书》已经写明了你的命运，你像狐狸一样溜进来,像狮子一样统治，却终将像狗一样死去。随后，“格萨尔王”拔离了预言中即将死亡的帝国地面,穿梭过轨道防御面，带着依诺克信徒远走，离开了已知的世界......“随后的故事我们都知道了，苏尼塞拉如预言所说一样悲惨的死去。但格萨尔王与三十名助祭的事迹却成为传说，演变成多种传奇故事，流传在银河之中。”"

 crs_event.4.name:0 "结语"
 crs_event.4.desc:0 "如今，人类文明已扩张至1000光年直径，但未知的浓雾仍旧笼罩深空，人类的未来将驶向何方？藏在星云中的未来将是和平还是战争？光明还是黑暗\n在探索中，我们又发现了两艘更加强力的舰船———战巡 空鸽   战列 那罗延天"
 crs_event.4.a:0 "查看资料：空鸽"
 crs_event.4.b:0 "查看资料：那罗延天"
 crs_event.41.name:0 "舰船资料：空鸽"
 crs_event.41.desc:0 "A.G.E.1060年，在天启帝国上一任大教长被一艘穹鸟级刺杀之后的第61年，依诺克旧礼会又一次涉嫌参与了天启境内的一次不光彩的行动。这次事件的受害者希丁.哈塞尔，只是卡米勒总督区一个身份低微的小伯爵，但从被刺杀的待遇来看，却比大教长还要尊贵!--执行这次任务的清理者驾驶的是比当年的穹鸟级更高级的型号:空鸮级。空鸮级是在这次刺杀事件发生的同时才由沙加缅度公布的舰船。作为第二艘由沙加缅度参与的朗基努斯-项目成果，“空鸮"与“穹鸟"相比，除了装甲性能、电容和计算力的常规升级外，其战术组件也进行了相应的升级--实际上也很常规，除了发言人在发布会的未尾轻描淡写地提了一句话:第一艘空鸮级将被赠送给希丁哈塞尔，以作为海岸线财团与天启帝国“友谊的见证"。几乎在发言人说出这句话的同一时间，远在五百多光年外的希丁.哈塞尔连同自己的豪宅一起被全新升级的超激发态偏移光束"从TL557二号行星的轨道上抹去。在规范玻色子光淬灭增幅器闪耀的光芒中，巨大的豪宅变成了正在逐渐落向大气层的总重量三干吨的太空垃圾。卡米勒总督府在后的很长一段时间内一直保持沉默面对任何记者的提问都只有一句回答:事件正在调查中，还不能公布太多消息。在总督府的调查结果出来之前，关于希丁.哈塞尔的众多信息很快地被网络挖掘出来了。对于一桩发生在天启帝国境内的事件而言这可不太常见--毕竟这位当事人只不过是一个小小的落魄伯爵。哈塞尔家族的历史不过三代，曾经在巴达先星系负责卡米勒军工厂的原材料采购，但不知道出于什么原因希丁--第三代哈塞尔--离开了巴达先，在TL557星系与克隆人指挥官军团合作，开设了自己的矿物加工产业--哈塞尔矿业。哈塞尔矿业的发展得很顺利，毕竟这是一个拥有五座星门四种行星类型的星系，还有一个强有力的克隆人指挥官军团抵御海盗。不出半年，其产出就远远超出了卡米勒军工的需求，附近的迈尔祖格总督区和底波拉家族也开始向希丁发来订单--报价甚至比卡米勒军工开出的价格还高。一个月后，哈塞尔矿业减少了对卡米勒军工的供应。又一个月后，哈塞尔矿业失去了对TL557星系矿产的开采权。再一个月后，希丁.哈塞尔手里拿着三份即将违约的合同与某位自称来自一家叫做“卡普满资源公司”的神秘男子见面了。三天后，哈塞尔矿业成了卡普满资源公司的子公司，主动中止了与两位天启大总督以及一个亲王家族的合同，并在违约金之外额外支付了一笔等同于违约金的致歉款。从此以后，作为卡普满子公司的哈塞尔再也没有接过天启国内的订单，而星际合众国的几家工程公司成了哈塞尔最大的客户，赚取了大量的联储币。同时，每个月希丁.哈塞尔也会向天启境内军事实力最强的总督萨汗.卡米勒上缴巨额税款。到此为止似乎是个多方共赢的局面，但就在“空鸮"级发布前一周，在A.6.E1060年的皎辉之夜，异端圣女阿伊莎和她的“异端教典"《月华典》传遍了天启帝国，各级枢机院开始对辖区内的教民们展开严格审查，以防大公会的异端思想污染了纯洁的帝国子民。据说，在卡米勒总督区，大公会的异端没揪出几个倒是发现了一大批依诺克旧礼会的信徒。除了少部分是克隆人指挥官的雇佣舰长之外，其余所有人几乎都与哈塞尔矿业有关。而异端审判团派往TL557星系的六百余名教士也全部消失了。据说，下埃如教长命卡米勒总督将希丁.哈塞尔带到索贝克接受大教长的亲自审判。萨汗.卡米勒知道此事严重，甚至调集了原本在征讨另一支异端首领鲁特的阿瓦塔利军团。然而还没等军队集结完毕，全银河第一艘亮相在发布会现场之外的“空鸮"级那明蓝色尾焰已经掠过了TL557二号行星的上空。"
 crs_event.42.name:0 "舰船资料：那罗延天"
 crs_event.42.desc:0 "“那罗延天"型重火力战列舰是沙加缅度投资公司在参与朗基努斯计划后，对格萨尔王进行全面升级的产物。当然，这一舰型也得到了依诺克旧礼会的授权。该舰型装备了格萨尔王级战列舰的战术组件和超级武器的升级版：规范玻色子光淬灭增幅器和超激发态放大光束。此外，该舰型还进一步提升了电容和运算力，使其能够装备更加高端的武器和组件，这些升级令那罗延天无可置疑的跻身银河火力战列舰第一梯队。在依诺克旧礼会的记载中，怛特罗被认为是第一位降临银河的神。早在人类还未踏足星空的时候，怛特罗便降临到众人之间,向他们讲述宇宙的真相。他将恒星摘下并剖开，向他的信徒展示核子的力量；他带领众人进入普朗克尺度，教会他们隧迁的奥秘。感激于怛特罗的引导，他的信徒们建立了最初的教团。之后，怛特罗重归深空。但魔已跟随他一并来到了地上，潜伏在人心之中。终于，魔积攒了足够的力量，它附身于当时帝国的女王身上，进而支配了整个人类在其治下，怛特罗的信众被疯狂打压，被迫转入地下。然而，怛特罗从未远离自己的信众。他将自己的化身置于帝国女王的身体中，魔如此傲慢,因而没有检查它的附身者，怛特罗的化身就这样在魔的眼皮底下降生。据记载，当这名王子降生，七颗恒星发生氦闪，七个星云吐出彗星。他正常的成长起来，娶妻生子，度过了平凡的半生。但在一天,女王将王子叫来，命他陪同"欣赏"对一名怛特罗信众的处刑。在女王的命令下，这名信徒的脸皮被剥下，并被侍卫扔进了等离子炉中。当信徒惨叫着化为灰烬时，女王发出了邪恶的笑声。此事深深震撼了王子。自那以后，王子深受幻视与幻听的困扰。他把自己关在屋子里七十七天，茶饭未进，终于领悟到自己的使命。随后，他按照幻象的指引前往星空深处寻找启示之地。在那里，他将那些幻象编撰为《怛特罗预言书》。王子归来时径直前去与女王对峙。他声称自己已不是王子，而是那罗延，是他自己所写预言中的神之使者怛特罗的化身；他知道在女王的皮囊下隐藏着怎样的黑暗和邪恶。他称自己找到了神之居所，发现了怛特罗留下的秘密。他见到了宇宙的本原，得悟正道。他遇到了神的使者，他们向他展示了怛特罗如何使用曲面之镜窥探最宏大的星空和最微小的粒子结构。也就在那时，他发现了魔的存在。女王宣布王子得了失心疯。那罗延不为所动，大声呵斥女王早已误入歧途，而只有他能够带领虔信者前往神所居住之地，为人类铸就辉煌的未来。女王命士兵抓捕那罗延，而那罗延双目放光，一缕黑气随即从女王身上浮出。那正是魔的身形。那罗延同样现出了真身。魔与他的体型很快超过了高楼与庙宇，又很快超出了星球。他们在宇宙中对决,所有人都知道结果将会决定人类的未来。魔挥动手臂，蜷曲的十一个维度倏然展开，将魔周身凹凸的空间熨成平滑的平面，任何能量都会从这空间中滑开；那罗延伸出两指，拨动虚空之弦，时空泛起的涟漪将平滑空间尽数破坏。魔剖开胸口，将黑心取出，化为熵增之箭,向神之使者射去；那罗延张开手臂，几何法则被改写，圆周不再是圆，矩形不再为方，熵之箭没入无限的悖论之中,永远处在路途之中，却无法抵达目标。魔缩小身形,遁入量子的领域，沿时间之轴逃离;于是神之使者令所有波函数坍缩为一，魔就这样被困在了永恒与须臾之间。那罗延发出胜利的吼声，帝国的军队旋即崩溃。但那罗延又是仁慈的，他放过了帝国女王，承诺自己不会降下神罚一他唯一要求的是将所有信众带离，他会引导他们前往神居之地。这就是依诺克旧礼会文献中那罗延的故事。在那之后，那罗延创建了依诺克教，供奉“神之子裔”。因其功绩依诺克信众尊敬地称呼他为“那罗延天”。尽管听起来完全是个神话，但最近对泰坦帝国的考古发现让历史学者们有理由怀疑，那罗延也许是阿斐叶女王时期那个名字被绝罚抹除的王子，也许他因政见与女王不合而利用了当时的宗教团体。依诺克主祭们对此说法嗤之以鼻。他们宣称已从怛特罗之镜中得到了那罗延天回归的启示，因此，他们将那罗延天之名赐予这艘战列舰——“座驾已备，静候无上至尊归位。”"
 crs_event.5.name:0 "结语"
 crs_event.5.desc:0 "我们在第五阶段的探索中几乎没有探索到然任何信息，我们只知道，四大国家最后崩解了....."

 crs_event.101.name:0 "大灾难《复仇女神》"
 crs_event.101.desc:0 "我们发现，曾经，我们那未知母星上的各天文台观测发现，一场前所未有的灾难即将降临。100年后，太阳伴星‘复仇女神’威胁了整个母星系，其时间持续长达百年。百年中，母星上所有地表建筑和生物将遭受严重威胁。如果没有合理应对方式，我们母星的所有生命会面临灭绝的境遇。我们将继续探索"
 crs_event.201.name:0 "先祖编年史 曙光纪元（？？？~B.G.1240年）"
 crs_event.201.desc:0 "我们在一本未知的档案中发现了我们前生的真相\n\n传说中，远古海格拉的知识圣殿里留下了[Root.Species.GetName]模糊不清的起源：[Root.Species.GetName]这一物种发源自同一恒星系统，也就是所谓的“起源”星系，其被当代史学家们认为是现当代文明的滥觞，但是其确切位置已经不可考证。该星系恒星的伴星“复仇女神”带来了末日，不同文明内涵下的[Root.Species.GetName]都在试图寻找逃离末日的新生之地。最终，在持续百年的“末日纪元”后，[Root.Species.GetName]文明离散的种子在遥不可及的深空中各自完成了复苏，开始了历史上记载的“曙光纪元”。"
 crs_event.301.name:0 "近代编年史 融合纪元（B.G.1240年-A.G.1）"
 crs_event.301.desc:0 "这个纪元以全面星际战争拉开序幕，第二银河的势力在此期间重新洗牌，许多小文明世界在战火中烟消云散，但文明间的交流与融合却是前所未有的，为此这一千两百年的时间被当代历史学家马苏里称为“融合纪元”。"
 crs_event.401.name:0 "泰格斯大帝和他的银河帝国（A.G.1-A.G.336年）"
 crs_event.401.desc:0 "泰格斯完成了他的征服，建立了领土空前广阔的阿特拉斯银河帝国，也就是在历史上的第二泰坦帝国。泰格斯改历法为银河历，开启银河纪元。为满足统治需要，泰格斯定都格里克，将本图西保留地、斯巴达全境作为皇帝直辖区，按照星门通路分割旧有国家，建立为若干星省，每个星省委派阿特拉斯总督进行治理。天启被授予自治权权，成为独立领，晨曦商贸联盟作为一种经济体被允许保留，有权在皇帝提供的候选人中选举总督。为镇压各区域零星爆发的起义、维持广阔疆域的统治，总督被授予星省内的军政大权，任期8年。但同时泰格斯也在星门枢纽建立军事要塞，驻扎直属皇帝的军队，并从总督家族中抽调子弟组成第一禁卫军团，充当皇帝仪仗，给与他们优渥的待遇，他们实质上既是维系皇帝与总督的纽带，也是总督家族在皇帝手中的人质。为解决统治广袤星区所需兵源不足的问题，A.G.7年，泰格斯大帝发布《墨伽拉敕令》，确立真神教为国教，此后的泰坦皇帝开始拥有教名，此举赢得了天启平民、基层军官以及祭祀集团的支持，随后祭祀集团组建了‘真神之剑’编入了皇帝的军队。《敕令》提升了天启的地位，但也引发了其他宗教信徒的大规模抗议，8年初，抗议在地下各地暗藏的反抗组织的煽动下转变为大规模的起义，泰格斯对此进行了血腥镇压，异端教派遭到屠杀和流放，这就是历史上著名的‘天罚之月’。‘天罚之月’后，泰格斯下令宣布各星省内的私营非民用科研机构为非法，限期解散。此后的二十年中，泰格斯面对不时出现的反抗星省恩威并施，逐步瓦解了反抗势力，自此帝国进入了稳定期。93年，年暮的泰格斯下令在斯巴达轨道上兴建直径2000km的巨型太空城‘凯旋堡’作为新首都，但他并未能看见凯旋堡的完工，96年，泰格斯大帝逝世。"
