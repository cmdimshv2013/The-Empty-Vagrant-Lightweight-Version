 s1s:0 "战术4联粒子炮"
 s1s_DESC:0 "军备竞赛从来没有被在明面上被承认过，但实际上名大相关研究所及制造商早已心知肚明。为了顺应越来越复杂多变的战场情况，能够适应不同射程的战术型武器成为研发热门。\n在应用了奇点科技公司专利中的强相互作用扭结衰变技术后，最新型的战术粒子加速器能够将粒子出口初速提高一倍。但代价是额外增加的粒子所携电荷量这使得射出的粒子在超出一定距离后将发生严重的偏转。另外，由于战术粒子炮的出口初速足够高，甚至可以在极远的距离对目标造成伤害。"
